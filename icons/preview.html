<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dis nos horaires icons</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font: 16px/1.4 ui-monospace, Menlo, monospace; padding: 2rem; max-width: 1200px; margin: 0 auto; color: #000; background: #fff; }
  h1 { font: 700 2.5rem "Times New Roman", Times, serif; }
  .spec { border: 3px solid #000; padding: 1rem; margin: 1rem 0 2rem; display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; font-size: .85rem; }
  h2 { font-size: 1rem; margin: 2rem 0 1rem; padding-bottom: .5rem; border-bottom: 3px solid #000; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 0; border-left: 1px solid #000; border-top: 1px solid #000; }
  .icon-card { display: flex; flex-direction: column; align-items: center; gap: .5rem; padding: 1rem .5rem; border-right: 1px solid #000; border-bottom: 1px solid #000; }
  .icon-card:hover { background: #ff0; }
  .label { font-size: .7rem; }
  .dark { background: #000; color: #fff; padding: 2rem; margin-top: 2rem; }
  .dark h2 { border-color: #fff; margin-top: 0; }
  .dark .grid, .dark .icon-card { border-color: #fff; }
  .dark .icon-card:hover { background: #ff0; color: #000; }
</style>
</head>
<body>
<h1>Dis nos horaires icons</h1>
<p>3 icons, sharp, 2026-10-09</p>
<div class="spec">
  <span>Grid: 24px</span><span>Stroke: 2px</span>
  <span>Caps: square</span><span>Joins: miter</span>
  <span>Corner radius: 0px</span><span>Padding: 2px</span>
</div>
<h2>24px</h2>
<div class="grid">
<div class="icon-card"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><rect x="10.5" y="7.5" width="3" height="3" fill="currentColor"/></svg><span class="label">map-pin</span></div>
<div class="icon-card"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><polygon points="7 4 20 12 7 20"/></svg><span class="label">play</span></div>
<div class="icon-card"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path d="M18 13v8H3V6h8M14 3h7v7M21 3 11 13"/></svg><span class="label">external-link</span></div>
<div class="icon-card"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><rect x="3" y="3" width="18" height="18"/><rect x="11" y="6.5" width="2" height="2" fill="currentColor" stroke="none"/><path d="M12 11.5v6"/></svg><span class="label">info</span></div>
</div>
<h2>48px</h2>
<div class="grid">
<div class="icon-card"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><rect x="10.5" y="7.5" width="3" height="3" fill="currentColor"/></svg><span class="label">map-pin</span></div>
<div class="icon-card"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><polygon points="7 4 20 12 7 20"/></svg><span class="label">play</span></div>
<div class="icon-card"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path d="M18 13v8H3V6h8M14 3h7v7M21 3 11 13"/></svg><span class="label">external-link</span></div>
<div class="icon-card"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><rect x="3" y="3" width="18" height="18"/><rect x="11" y="6.5" width="2" height="2" fill="currentColor" stroke="none"/><path d="M12 11.5v6"/></svg><span class="label">info</span></div>
</div>
<div class="dark">
<h2>48px, dark</h2>
<div class="grid">
<div class="icon-card"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><rect x="10.5" y="7.5" width="3" height="3" fill="currentColor"/></svg><span class="label">map-pin</span></div>
<div class="icon-card"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><polygon points="7 4 20 12 7 20"/></svg><span class="label">play</span></div>
<div class="icon-card"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path d="M18 13v8H3V6h8M14 3h7v7M21 3 11 13"/></svg><span class="label">external-link</span></div>
<div class="icon-card"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><rect x="3" y="3" width="18" height="18"/><rect x="11" y="6.5" width="2" height="2" fill="currentColor" stroke="none"/><path d="M12 11.5v6"/></svg><span class="label">info</span></div>

</div>
</body>
</html>
