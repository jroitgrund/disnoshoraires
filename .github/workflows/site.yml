name: site

on:
  schedule:
    # 00:01 in Paris in winter time, 01:01 in summer time: always after midnight, so the crawl starts on the new day.
    - cron: "1 23 * * *"
  workflow_dispatch:
    inputs:
      crawl_run:
        description: ID of a run whose crawl to reuse (within a day). Empty crawls again.
        required: false
        default: ""
      cities:
        description: Slugs of the cities to crawl, separated by spaces. Empty crawls all. The other cities keep the latest data.
        required: false
        default: ""
      refresh:
        description: Look up all movies again, not only the new ones.
        type: boolean
        default: false
  push:
    branches-ignore: [main]

jobs:
  cities:
    if: github.event_name != 'push' && github.ref == 'refs/heads/main' && !inputs.crawl_run
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      slugs: ${{ steps.list.outputs.slugs }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # The longest crawls first: Paris takes 23 min, the other cities 1 to 4 min each.
      - id: list
        env:
          CITIES: ${{ inputs.cities }}
        run: >
          echo "slugs=$(node --input-type=module -e "const { CITIES, cityBySlug } = await import('./shared/cities.ts');
          const wanted = (process.env.CITIES ?? '').split(' ').filter((slug) => slug !== '');
          const cities = wanted.length === 0 ? CITIES : wanted.map(cityBySlug);
          console.log(JSON.stringify(cities.toSorted((a, b) => b.crawlSeconds - a.crawlSeconds)
          .map((city) => city.slug)))")" >> "$GITHUB_OUTPUT"

  # One job per city, in parallel: one after the other, the crawl takes over an hour.
  crawl:
    needs: cities
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Paris takes longer than the other cities on 3 runners: more runners only add load.
      max-parallel: 4
      matrix:
        city: ${{ fromJSON(needs.cities.outputs.slugs) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # pantomime opens Google Chrome with a window: it needs Chrome and a display.
      - run: npx patchright install --with-deps --force chrome
      - run: xvfb-run --auto-servernum npm run crawl -- ${{ matrix.city }}
      - uses: actions/upload-artifact@v5
        with:
          name: showtimes-${{ matrix.city }}
          path: data/showtimes/
          retention-days: 1

  # Runs when the crawl jobs are done, also after a failed city: it keeps its latest data, and the past days drop.
  production:
    needs: crawl
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.crawl.result == 'success' || needs.crawl.result == 'failure' || inputs.crawl_run) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    concurrency: data
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx patchright install --with-deps --force chrome
      - uses: actions/download-artifact@v5
        with:
          pattern: showtimes-*
          path: data/showtimes/
          merge-multiple: true
          run-id: ${{ inputs.crawl_run || github.run_id }}
          github-token: ${{ github.token }}
      # Enrich reuses the results of the last data.
      - uses: dawidd6/action-download-artifact@v27
        with:
          name: data
          path: earlier
          search_artifacts: true
          workflow_conclusion: ""
          if_no_artifact_found: warn
      # The cities not crawled in this run, or whose crawl failed, keep the latest data.
      - run: test ! -d earlier/showtimes || cp -n earlier/showtimes/*.json data/showtimes/
      - run: test ! -f earlier/external.json || cp earlier/external.json data/external.json
      # Every Monday in Paris, the ratings include the weekend after Wednesday's releases.
      - env:
          REFRESH: ${{ inputs.refresh }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$REFRESH" = true ] || { [ "$EVENT" = schedule ] && [ "$(TZ=Europe/Paris date +%u)" = 1 ]; }; then
            xvfb-run --auto-servernum npm run enrich -- --refresh
          else
            xvfb-run --auto-servernum npm run enrich
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: data
          path: data/
          retention-days: 90
      - name: Delete older data artifacts
        run: >
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=data&per_page=100"
          --jq ".artifacts[] | select(.workflow_run.id != $GITHUB_RUN_ID) | .id"
          | xargs -r -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/{}"
      - run: npm run build
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  preview:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: dawidd6/action-download-artifact@v27
        with:
          name: data
          path: data
          search_artifacts: true
          workflow_conclusion: ""
      - run: npm run build
      - name: Upload preview
        # A preview alias allows only lower case letters, digits and dashes.
        run: >
          npx wrangler versions upload --preview-alias "$(echo "$GITHUB_REF_NAME"
          | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-40)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
