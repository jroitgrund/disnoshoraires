name: site

on:
  schedule:
    # Tuesday 09:00 in Paris in summer time, 08:00 in winter time.
    - cron: "0 7 * * 2"
  workflow_dispatch:
  push:
    branches-ignore: [main]

jobs:
  cities:
    if: github.event_name != 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      slugs: ${{ steps.list.outputs.slugs }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - id: list
        run: >
          echo "slugs=$(node --input-type=module -e "const { CITIES } = await import('./shared/cities.ts');
          console.log(JSON.stringify(CITIES.map((city) => city.slug)))")" >> "$GITHUB_OUTPUT"

  # One job per city, in parallel: one after the other, the crawl takes over an hour.
  crawl:
    needs: cities
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Paris alone takes as long as the other cities on 3 runners: more runners only add load.
      max-parallel: 4
      matrix:
        city: ${{ fromJSON(needs.cities.outputs.slugs) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # pantomime opens Google Chrome with a window: it needs Chrome and a display.
      - run: npx patchright install --with-deps --force chrome
      - run: xvfb-run --auto-servernum npm run crawl -- ${{ matrix.city }}
      - uses: actions/upload-artifact@v5
        with:
          name: showtimes-${{ matrix.city }}
          path: data/showtimes/
          retention-days: 1

  # Runs only when all cities are crawled: a city without data has no page.
  production:
    needs: crawl
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    concurrency: data
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx patchright install --with-deps --force chrome
      - uses: actions/download-artifact@v5
        with:
          pattern: showtimes-*
          path: data/showtimes/
          merge-multiple: true
      - run: xvfb-run --auto-servernum npm run enrich
      - uses: actions/upload-artifact@v5
        with:
          name: data
          path: data/
          retention-days: 90
      - name: Delete older data artifacts
        run: >
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=data&per_page=100"
          --jq ".artifacts[] | select(.workflow_run.id != $GITHUB_RUN_ID) | .id"
          | xargs -r -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/{}"
      - run: npm run build
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  preview:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: dawidd6/action-download-artifact@v27
        with:
          name: data
          path: data
          search_artifacts: true
          workflow_conclusion: ""
      - run: npm run build
      - name: Upload preview
        # A preview alias allows only lower case letters, digits and dashes.
        run: >
          npx wrangler versions upload --preview-alias "$(echo "$GITHUB_REF_NAME"
          | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-40)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
